[project]
name = "mydt-pipeline"
version = "0.1.0"
description = "Automated update, validation, consolidation and reporting for SDG 4 multi-year dynamic templates (demo with synthetic data)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "openpyxl>=3.1", "pyyaml>=6", "jinja2>=3.1", "streamlit>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mydt = "mydt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
