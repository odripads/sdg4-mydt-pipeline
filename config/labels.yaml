ru:
  year: Год
  sex: {F: Женщины (F), M: Мужчины (M), T: Всего (T)}
  titles:
    COVER: Титульный лист и сведения о респонденте
    METADATA: Источники и метаданные по каждой таблице
    ENRL_AGE: Численность учащихся по уровню образования, возрасту и полу
    ENRL_GRADE: Численность учащихся по уровню образования, классу и полу
    REPEATERS: Второгодники по уровню образования, классу и полу
    TEACHERS: Учителя по уровню образования и полу
    FIN: Финансирование образования (млн, национальная валюта)
    POP: Население школьного возраста по однолетним группам (заполнено заранее, оценки ООН)
    CHECKS: Автоматические проверки
  instructions:
    data: Вводите целые числа. Если значение отсутствует, введите m (нет данных), a (не применимо), x (включено в другую категорию) или n (ноль). Жёлтые столбцы — новый год для заполнения.
    prefilled: Заполнено ИСЮ. Не изменять. Если вы считаете, что значение неверно, свяжитесь с ИСЮ.
    checks: Перед отправкой во всех ячейках статуса должно быть OK. CHECK означает расхождение между двумя таблицами.
  validation_error: Введите число не меньше нуля или один из кодов m, a, x, n.
  codes:
    L1: Начальное образование (МСКО 1)
    L2: Первый этап среднего образования (МСКО 2)
    L3: Второй этап среднего образования (МСКО 3)
    "<5": Младше 5 лет
    "21+": 21 год и старше
    UNK: Возраст неизвестен
    TCH: Учителя, всего
