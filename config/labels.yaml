    XEXP_L1: Государственные расходы на начальное образование
    XEXP_L2: Государственные расходы на первый этап среднего образования
    XEXP_L3: Государственные расходы на второй этап среднего образования
    XEXP_EDU: Государственные расходы на образование, все уровни
    XEXP_GOV: Общие государственные расходы, все сектора
    GDP: Валовой внутренний продукт
    POP: Население
  cover:
    ISO3: Код страны ISO 3166
    COUNTRY: Страна
    SURVEY_YEAR: Год обследования
    LANG: Язык шаблона
    CURRENCY: Национальная валюта
    ENTRANCE_AGE: Официальный возраст поступления в начальную школу
    RESP_NAME: Имя респондента
    RESP_EMAIL: Электронная почта респондента
    SUBMIT_DATE: Дата отправки
  metadata:
    TABLE: Таблица
    SOURCE: Источник данных
    REF_DATE: Дата, на которую приведены данные
    COVERAGE: Охват (государственные, частные)
