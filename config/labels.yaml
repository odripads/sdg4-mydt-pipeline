# Visible labels for the templates, one block per language.
# Codes (sheet names, L1, G7, F, XEXP_EDU...) never change between languages,
# so the same reader parses every language version.
# Machine-assisted translations: a native-speaking reviewer should check them
# before templates go to countries.

en:
  year: Year
  sex: {F: Female (F), M: Male (M), T: Total (T)}
  titles:
    COVER: Cover page and respondent details
    METADATA: Sources and metadata for each table
    ENRL_AGE: Enrolment by level of education, age and sex
    ENRL_GRADE: Enrolment by level of education, grade and sex
    REPEATERS: Repeaters by level of education, grade and sex
    TEACHERS: Teachers by level of education and sex
    FIN: Education finance (millions, national currency)
    POP: School-age population by single age (pre-filled, UN population estimates)
    CHECKS: Automatic validation checks
  instructions:
    data: Enter whole numbers. If a value is not available, enter m (missing), a (not applicable), x (included elsewhere) or n (nil). Yellow columns are the new year to complete.
    prefilled: Pre-filled by the UIS. Do not edit. Contact the UIS if you think a figure is wrong.
    checks: Every status cell should read OK before you submit. CHECK means two tables disagree.
  validation_error: Enter a number of zero or more, or one of the codes m, a, x, n.
  codes:
    L1: Primary education (ISCED 1)
    L2: Lower secondary education (ISCED 2)
    L3: Upper secondary education (ISCED 3)
    "<5": Under 5
    "21+": 21 and over
    UNK: Age unknown
    TCH: Teachers, total
    TCH_TRAINED: Teachers with minimum required training
    XEXP_L1: Government expenditure on primary education
    XEXP_L2: Government expenditure on lower secondary education
    XEXP_L3: Government expenditure on upper secondary education
    XEXP_EDU: Government expenditure on education, all levels
    XEXP_GOV: Total government expenditure, all sectors
    GDP: Gross domestic product
    POP: Population
  cover:
    ISO3: ISO 3166 country code
    COUNTRY: Country
    SURVEY_YEAR: Survey year
    LANG: Template language
    CURRENCY: National currency
    ENTRANCE_AGE: Official entrance age, primary
    RESP_NAME: Respondent name
    RESP_EMAIL: Respondent email
    SUBMIT_DATE: Submission date
  metadata:
    TABLE: Table
    SOURCE: Data source
    REF_DATE: Reference date
    COVERAGE: Coverage (public, private)
    NOTES: Notes
  checks:
    AGE_TOT: Total enrolment from the age table
    GRADE_TOT: Total enrolment from the grade table
    DIFF: Difference
    SEXSUM: Female + Male - Total (age table)
    STATUS: Status

